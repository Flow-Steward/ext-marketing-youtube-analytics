        is intended exclusively for YouTube content partners that own and manage many different YouTube
        channels. The onBehalfOfContentOwner parameter indicates that the request''s authorization credentials
        identify a YouTube user who is acting on behalf of the content owner specified in the parameter
        value. It allows co'
  - name: all_pages
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: All pages
      description: Read page after page until the list ends, max_items are read, the output is full or
        time runs out; then next_page_token says where to continue.
  - name: max_items
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100000
      title: Most records
      description: 'With all_pages: the most records to read (default 10000).'
  - name: skip
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 0
      maximum: 100000
      title: Skip
      description: 'With all_pages and page_token: how many records of that page an earlier run already
        returned (its next_skip).'
