- operation_id: get_analytics_groups
  display_name: Get analytics groups
  description: 'Reads YouTube Analytics groups by ID or of the connected account. YouTube: Returns a collection
    of groups that match the API request parameters. For example, you can retrieve all groups that the
    authenticated user owns, or you can retrieve one or more groups by their unique IDs. Calls youtubeAnalytics.groups.list
    (GET /v2/groups) of the YouTube Analytics API. Returns one page in items with next_page_token; with
    all_pages it reads every page, up to max_items. Google scopes: youtube, youtube.readonly, youtubepartner,
    yt-analytics-monetary.readonly, yt-analytics.readonly.'
