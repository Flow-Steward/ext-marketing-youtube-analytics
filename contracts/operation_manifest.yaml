- operation_id: query_analytics_report
  display_name: Query analytics report
  description: 'Reads a YouTube Analytics report: metrics by dimensions for a channel or content owner
    over a date range. YouTube: Retrieve your YouTube Analytics reports. Calls youtubeAnalytics.reports.query
    (GET /v2/reports) of the YouTube Analytics API. Sent as given: Get channel report, Get video report
    and Get top videos check the combination against YouTube''s report tables first. Google scopes: youtube,
    youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.'
  operation_kind: source
  category: marketing
  connection_type_ids:
  - youtube_analytics_channel
  - youtube_analytics_channel_monetary
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: filters
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: filters
      description: A list of filters that should be applied when retrieving YouTube Analytics data. The
        Available Reports document identifies the dimensions that can be used to filter each report, and
        the Dimensions document defines those dimensions. If a request uses multiple filters, join them
        together with a semicolon (;), and the returned result table will satisfy both filters. For example,
        a filters parameter v
  - name: currency
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: currency
      description: The currency to which financial metrics should be converted. The default is US Dollar
        (USD). If the result contains no financial metrics, this flag will be ignored. Responds with an
        error if the specified currency is not recognized.
  - name: max_results
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      title: maxResults
      description: The maximum number of rows to include in the response.
  - name: dimensions
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: dimensions
      description: A comma-separated list of YouTube Analytics dimensions, such as views or ageGroup,gender.
        See the Available Reports document for a list of the reports that you can retrieve and the dimensions
        used for those reports. Also see the Dimensions document for definitions of those dimensions.
  - name: sort
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: sort
