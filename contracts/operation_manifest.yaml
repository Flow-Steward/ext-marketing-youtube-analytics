    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: id
      description: The id parameter specifies a comma-separated list of the YouTube group ID(s) for the
        resource(s) that are being retrieved. Each group must be owned by the authenticated user. In a
        group resource, the id property specifies the group's YouTube group ID. Note that if you do not
        specify a value for the id parameter, then you must set the mine parameter to true.
  - name: on_behalf_of_content_owner
    value_type: text
    required: false
