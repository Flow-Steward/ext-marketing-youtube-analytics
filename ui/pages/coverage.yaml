components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The pinned Discovery document of the YouTube Analytics API v2 (revision 20261122, downloaded 2026-11-23) lists 8 methods. **Each of them has its own step**: 3 reads (GET) and 5 changes to YouTube Analytics groups. Test runs never send changes.

    The report tables of YouTube's channel reports page (47 reports) are the rules the everyday report steps check a request against.

    Not in this extension:

    - **YouTube Reporting API**: Bulk reports YouTube prepares as files on a schedule: a separate product with its own Discovery document (youtubereporting v1).
    - **YouTube Data API v3**: Channels, videos, playlists and comments: the Flow Steward YouTube extension (flowsteward.youtube) covers that API.

    The everyday steps on top: test the connection, get a channel report, get a video report, get the top videos of a period, get all my groups, create a group and add a video to a group.
