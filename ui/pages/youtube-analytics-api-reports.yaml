  body: |
    ### Query analytics report

    Reads a YouTube Analytics report: metrics by dimensions for a channel or content owner over a date range. YouTube: Retrieve your YouTube Analytics reports. Calls youtubeAnalytics.reports.query (GET /v2/reports) of the YouTube Analytics API. Sent as given: Get channel report, Get video report and Get top videos check the combination against YouTube's report tables first. Google scopes: youtube, youtube.readonly, youtubepartner, yt-analytics-monetary.readonly, yt-analytics.readonly.

    Action id `query_analytics_report` · reads only · YouTube: `GET /v2/reports`

    Inputs: `filters`, `currency`, `max_results`, `dimensions`, `sort`, `start_date` (required), `ids` (required), `end_date` (required), `include_historical_channel_data`, `start_index`, `metrics` (required).
