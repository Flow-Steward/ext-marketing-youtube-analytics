title: YouTube Analytics API
description: How the YouTube Analytics steps work, and the everyday steps.
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the YouTube Analytics API v2 for the connected channel. Every method of the API has a step: 15 steps in all, the everyday ones first.

    - **Checked combinations.** YouTube answers a report query it does not support with HTTP 400. Get channel report, Get video report and Get top videos first check the dimensions, metrics, filters, sort and max_results against the report tables of YouTube's channel reports page (see Report tables) and refuse a combination no table allows, with the reason. `matched_reports` names the tables that allow the request.
    - **Scopes.** Each step names the Google scopes that allow it. The connection type decides which scopes are asked for: YouTube channel analytics (yt-analytics.readonly) or YouTube channel analytics with revenue (also yt-analytics-monetary.readonly). Revenue metrics and ad performance reports need the second; the channel must be in the YouTube Partner Program.
    - **Numbers.** Report values are exact decimals, never rounded through floating point.
    - **Quota.** The YouTube Analytics API does not report a quota in its answers; when a limit is reached YouTube refuses and the step says so.
    - **Results.** A generated step returns `status`, `data` (YouTube's JSON), `etag` and `warnings`; Get analytics groups also returns `items`, `count`, `complete` and `next_page_token`.
    - **Lists.** With `all_pages` a list step reads page after page; when it stops early, `next_page_token` is where the next run starts, so nothing is skipped or read twice.
    - **Request bodies** are the YouTube resource as JSON in `body`. A field the resource does not have is refused before sending.
    - **Changes are sent once.** A step that changes data is never retried automatically; when its outcome is unclear it says so, and you check YouTube before running it again. Test runs never send changes.

    The steps by area:

    - **Reports** (1 steps)
    - **Groups** (7 steps)
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test connection

    Checks that YouTube Analytics accepts the connection's authorization by reading the views of the connected channel (ids channel==MINE) for one day, the day before today (UTC).

    Action id `test_connection` · reads only · YouTube: `GET /v2/reports`

    Inputs: none.

    Results: `connected`, `connection_type`, `revenue_metrics`, `day`, `warnings`.

    ### Get channel report

    Reads a YouTube Analytics report for the connected channel (or channel_id) from start_date to end_date: the metrics asked for, by the dimensions asked for, with the filters, sort and max_results given. Before anything is sent, the dimensions, metrics, filters, sort and max_results are checked against the report tables of YouTube's channel reports page: a combination no report allows is refused with the reason. Revenue metrics and ad performance reports need the connection type YouTube channel analytics with revenue.

    Action id `get_channel_report` · reads only · YouTube: `GET /v2/reports`

    Inputs: `start_date` (required), `end_date` (required), `metrics` (required), `dimensions`, `filters`, `sort`, `max_results`, `currency`, `channel_id`, `output`.

    Results: `column_headers`, `rows`, `row_count`, `matched_reports`, `file`, `warnings`.

    ### Get video report

    Reads a YouTube Analytics report for one video of the connected channel from start_date to end_date (the filter video==video_id): the metrics asked for, by the dimensions asked for, such as day or country. Before anything is sent, the dimensions, metrics, filters, sort and max_results are checked against the report tables of YouTube's channel reports page: a combination no report allows is refused with the reason. Revenue metrics and ad performance reports need the connection type YouTube channel analytics with revenue.

    Action id `get_video_report` · reads only · YouTube: `GET /v2/reports`

    Inputs: `video_id` (required), `start_date` (required), `end_date` (required), `metrics` (required), `dimensions`, `filters`, `sort`, `max_results`, `currency`, `channel_id`, `output`.

    Results: `column_headers`, `rows`, `row_count`, `matched_reports`, `file`, `warnings`.

    ### Get top videos

    Reads the connected channel's top videos from start_date to end_date (the dimension video), sorted by sort (default -views), at most max_results (default 10; YouTube allows at most 200 for these reports). Before anything is sent, the dimensions, metrics, filters, sort and max_results are checked against the report tables of YouTube's channel reports page: a combination no report allows is refused with the reason. Revenue metrics and ad performance reports need the connection type YouTube channel analytics with revenue.

    Action id `get_top_videos` · reads only · YouTube: `GET /v2/reports`

    Inputs: `start_date` (required), `end_date` (required), `metrics`, `sort`, `max_results`, `filters`, `currency`, `channel_id`.

    Results: `column_headers`, `rows`, `row_count`, `matched_reports`, `warnings`.

    ### Get all my groups

    Reads every YouTube Analytics group of the connected account (mine) with its title, item type and item count, page after page until all are read or max_groups; then complete is false and next_page_token says where to continue.

    Action id `list_groups` · reads only · YouTube: `GET /v2/groups`

    Inputs: `max_groups`, `page_token`.

    Results: `groups`, `count`, `complete`, `next_page_token`, `warnings`.

    ### Create group

    Creates a YouTube Analytics group with a title for items of one type (default youtube#video). Returns the new group_id; add items with Add video to group. Google may require the youtube scope for groups; then the step returns a permission refusal.

    Action id `create_group` · changes data in YouTube Analytics · YouTube: `POST /v2/groups`

    Inputs: `title` (required), `item_type`.

    Results: `group_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Add video to group

    Adds a video to a YouTube Analytics group of videos. When the video is already in the group YouTube answers HTTP 204 and the step returns already_in_group true; a full group is refused (groupContainsMaximumNumberOfItems). Google may require the youtube scope for groups; then the step returns a permission refusal.

    Action id `add_video_to_group` · changes data in YouTube Analytics · YouTube: `POST /v2/groupItems`

    Inputs: `group_id` (required), `video_id` (required).

    Results: `group_item_id`, `already_in_group`, `data`, `processing`, `applied`, `check`, `warnings`.
