project_scoped: false
components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The pinned Discovery document of the YouTube Analytics API v2 (revision 20261122, downloaded 2026-11-23) lists 8 methods. **Each of them has its own step**: 3 reads (GET) and 5 changes to YouTube Analytics groups. Test runs never send changes.

    The report tables of YouTube's channel reports page (47 reports) are the rules the everyday report steps check a request against.

    Other YouTube APIs:

    - **YouTube Reporting API**: Bulk reports YouTube prepares as files on a schedule: a separate product with its own Discovery document (youtubereporting v1).
    - **YouTube Data API v3**: Channels, videos, playlists and comments: the Flow Steward YouTube extension (flowsteward.youtube) covers that API.

    The everyday steps on top: test the connection, get a channel report, get a video report, get the top videos of a period, get all my groups, create a group and add a video to a group.
- component_id: coverage_detail
  type: markdown
  title: Every step
  body: |+
    ## Everyday

    ### Test connection (`test_connection`)

    YouTube: `GET /v2/reports`.

    Inputs: none.

    Returns: `connected`, `connection_type`, `revenue_metrics`, `day`, `warnings`.

    ### Get channel report (`get_channel_report`)

    YouTube: `GET /v2/reports`.

    Inputs: `start_date` (required), `end_date` (required), `metrics` (required), `dimensions`, `filters`, `sort`, `max_results`, `currency`, `channel_id`, `output`.

    Returns: `column_headers`, `rows`, `row_count`, `matched_reports`, `file`, `warnings`.

    ### Get video report (`get_video_report`)

    YouTube: `GET /v2/reports`.

    Inputs: `video_id` (required), `start_date` (required), `end_date` (required), `metrics` (required), `dimensions`, `filters`, `sort`, `max_results`, `currency`, `channel_id`, `output`.

    Returns: `column_headers`, `rows`, `row_count`, `matched_reports`, `file`, `warnings`.

    ### Get top videos (`get_top_videos`)

    YouTube: `GET /v2/reports`.

    Inputs: `start_date` (required), `end_date` (required), `metrics`, `sort`, `max_results`, `filters`, `currency`, `channel_id`.

    Returns: `column_headers`, `rows`, `row_count`, `matched_reports`, `warnings`.

    ### Get all my groups (`list_groups`)

    YouTube: `GET /v2/groups`.

    Inputs: `max_groups`, `page_token`, `skip`.

    Returns: `groups`, `count`, `complete`, `next_page_token`, `next_skip`, `warnings`.

    ### Create group (`create_group`)

    YouTube: `POST /v2/groups`.

    Inputs: `title` (required), `item_type`.

    Returns: `group_id`, `data`, `processing`, `applied`, `check`, `warnings`.

    ### Add video to group (`add_video_to_group`)

    YouTube: `POST /v2/groupItems`.

    Inputs: `group_id` (required), `video_id` (required).

    Returns: `group_item_id`, `already_in_group`, `data`, `processing`, `applied`, `check`, `warnings`.

    ## Reports

    ### Query analytics report (`query_analytics_report`)

    YouTube: `youtubeAnalytics.reports.query` (`GET /v2/reports`).

    Inputs: `filters`, `currency`, `max_results`, `dimensions`, `sort`, `start_date` (required), `ids` (required), `end_date` (required), `include_historical_channel_data`, `start_index`, `metrics` (required).

    Returns a QueryResponse with `kind`, `errors`, `columnHeaders`, `rows`.

    ## Groups

    ### Get analytics groups (`get_analytics_groups`)

    YouTube: `youtubeAnalytics.groups.list` (`GET /v2/groups`).

    Inputs: `page_token`, `mine`, `id`, `on_behalf_of_content_owner`, `all_pages`, `max_items`, `skip`.

    Returns a ListGroupsResponse; each item of `items` is a Group with `errors`, `kind`, `id`, `etag`, `snippet`, `contentDetails`.

    ### Create analytics group (`create_analytics_group`)

    YouTube: `youtubeAnalytics.groups.insert` (`POST /v2/groups`).

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a Group): `contentDetails`, `errors`, `etag`, `id`, `kind`, `snippet`.

    Returns a Group with `errors`, `kind`, `id`, `etag`, `snippet`, `contentDetails`.

    ### Update analytics group (`update_analytics_group`)

    YouTube: `youtubeAnalytics.groups.update` (`PUT /v2/groups`).

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a Group): `contentDetails`, `errors`, `etag`, `id`, `kind`, `snippet`.

    Returns a Group with `errors`, `kind`, `id`, `etag`, `snippet`, `contentDetails`.

    ### Delete analytics group (`delete_analytics_group`)

    YouTube: `youtubeAnalytics.groups.delete` (`DELETE /v2/groups`).

    Inputs: `id`, `on_behalf_of_content_owner`.

    Returns a EmptyResponse with `errors`.

    ### Get analytics group items (`get_analytics_group_items`)

    YouTube: `youtubeAnalytics.groupItems.list` (`GET /v2/groupItems`).

    Inputs: `group_id`, `on_behalf_of_content_owner`.

    Returns a ListGroupItemsResponse; each item of `items` is a GroupItem with `groupId`, `kind`, `resource`, `etag`, `id`, `errors`.

    ### Add analytics group item (`add_analytics_group_item`)

    YouTube: `youtubeAnalytics.groupItems.insert` (`POST /v2/groupItems`).

    Inputs: `on_behalf_of_content_owner`, `body` (required).

    Body (`body`, a GroupItem): `errors`, `etag`, `groupId`, `id`, `kind`, `resource`.

    Returns a GroupItem with `groupId`, `kind`, `resource`, `etag`, `id`, `errors`.

    ### Remove analytics group item (`remove_analytics_group_item`)

    YouTube: `youtubeAnalytics.groupItems.delete` (`DELETE /v2/groupItems`).

    Inputs: `id`, `on_behalf_of_content_owner`.

    Returns a EmptyResponse with `errors`.

